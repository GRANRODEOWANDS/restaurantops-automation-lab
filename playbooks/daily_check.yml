- name: Daily server check
  hosts: restaurants
  gather_facts: true

  tasks:
    - name: Check uptime
      ansible.builtin.command: uptime
      register: uptime_result
      changed_when: false

    - name: Display uptime result
      ansible.builtin.debug:
        msg: "{{ uptime_result.stdout }}"

    - name: Check memory usage
      ansible.builtin.command: free -h
      register: memory_result
      changed_when: false

    - name: Display memory usage
      ansible.builtin.debug:
        msg: "{{ memory_result.stdout }}"

    - name: Check disk usage
      ansible.builtin.command: df -h /
      register: disk_result
      changed_when: false

    - name: Display disk usage
      ansible.builtin.debug:
        msg: "{{ disk_result.stdout }}"

    - name: Extract disk usage percentage
      ansible.builtin.set_fact:
        disk_usage_percent: "{{ disk_result.stdout_lines[1].split()[4] | regex_replace('%', '') | int }}"

    - name: Display disk usage percentage
      ansible.builtin.debug:
        msg: "Disk usage: {{ disk_usage_percent }}%"

    - name: Display disk status
      ansible.builtin.debug:
        msg: >-
          {{ store_name }}:
          {{ 'WARNING' if disk_usage_percent | int >= 85 else 'OK' }}
          - Disk usage {{ disk_usage_percent }}%

    - name: Display OS information
      ansible.builtin.debug:
        msg: "{{ store_name }}: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Display management IP address
      ansible.builtin.debug:
        msg: "{{ store_name }}: {{ ansible_host }}"

    - name: Check nginx status
      ansible.builtin.command: systemctl is-active nginx
      register: nginx_result
      changed_when: false
      failed_when: false

    - name: Display nginx status
      ansible.builtin.debug:
        msg: "{{ store_name }}: nginx = {{ nginx_result.stdout }}"

    - name: Display nginx health status
      ansible.builtin.debug:
        msg: >-
          {{ store_name }}:
          {{ 'OK' if nginx_result.stdout == 'active' else 'WARNING' }}
          - nginx {{ nginx_result.stdout }}

    - name: Determine overall status
      ansible.builtin.set_fact:
        overall_status: >-
          {{
            'WARNING'
            if (disk_usage_percent | int >= 85 or nginx_result.stdout != 'active')
            else 'OK'
          }}

    - name: Display daily check summary
      ansible.builtin.debug:
        msg:
          - "===== {{ store_name }} ====="
          - "Overall Status : {{ overall_status }}"
          - "Management IP  : {{ ansible_host }}"
          - "OS             : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Disk Usage     : {{ disk_usage_percent }}%"
          - "nginx          : {{ nginx_result.stdout }}"
          - "Uptime         : {{ uptime_result.stdout }}"
